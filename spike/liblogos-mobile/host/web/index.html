<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logos web module</title>
<style>
  body { font: 15px -apple-system, sans-serif; margin: 12px; background: #f4f4f8; color: #222; }
  #sum { font-size: 40px; font-weight: 700; }
  #events, #calls { font-family: Menlo, monospace; font-size: 12px; white-space: pre-wrap; }
  .ok { color: #0a7f2e; }
</style>
</head>
<body>
<div>counter.add(1, 2) =</div>
<div id="sum">…</div>
<div>events:</div>
<div id="events"></div>
<div>native calls into this page:</div>
<div id="calls"></div>
<script>
// Mirrors logos-protocol's plain transport messages (rpc_message.h) as JSON
// over WKScriptMessageHandler; "type" discriminates because there is no
// framing here.
const pending = {};
let nextId = 1;
let token = '';
const provided = {
  upper: (s) => String(s).toUpperCase(),
};
// Channel: fetch() against the logos:// URL scheme the host serves this page
// from (no WKScriptMessageHandler, see WebRelay.mm). Outbound messages are
// POSTed one per request; inbound ones arrive as a JSON array on a long-poll.
function post(o) { return fetch('/msg', { method: 'POST', body: JSON.stringify(o) }); }
async function poll() {
  for (;;) {
    try {
      const r = await fetch('/inbox');
      const list = await r.json();
      list.forEach((m) => window.__logosDeliver(m));
    } catch (e) {
      line('events', 'inbox error: ' + e, '');
      await new Promise((res) => setTimeout(res, 500));
    }
  }
}
function call(object, method, args) {
  return new Promise((resolve) => {
    const id = nextId++;
    pending[id] = resolve;
    post({ type: 'call', id, authToken: token, object, method, args });
  });
}
function line(el, text, cls) {
  const d = document.createElement('div');
  d.textContent = text;
  if (cls) d.className = cls;
  document.getElementById(el).appendChild(d);
}
window.__logosDeliver = function (msg) {
  if (typeof msg === 'string') msg = JSON.parse(msg);
  switch (msg.type) {
    case 'token': {           // TokenMessage {authToken, moduleName, token}
      token = msg.token;
      run();
      break;
    }
    case 'result': {          // ResultMessage {id, ok, value | err, errCode}
      const r = pending[msg.id];
      delete pending[msg.id];
      if (r) r(msg);
      break;
    }
    case 'event': {           // EventMessage {object, event, data}
      line('events', msg.object + '.' + msg.event + ' ' + JSON.stringify(msg.data), 'ok');
      break;
    }
    case 'call': {            // Level C: native -> page CallMessage
      const fn = provided[msg.method];
      line('calls', msg.object + '.' + msg.method + '(' + JSON.stringify(msg.args) + ')');
      if (!fn) {
        post({ type: 'result', id: msg.id, ok: false, err: 'no such method', errCode: 'method_not_found' });
      } else {
        const value = fn.apply(null, msg.args);
        line('calls', ' -> ' + JSON.stringify(value), 'ok');
        post({ type: 'result', id: msg.id, ok: true, value });
      }
      break;
    }
  }
};
async function run() {
  const r = await call('counter', 'add', [1, 2]);
  document.getElementById('sum').textContent = r.ok ? String(r.value) : ('error: ' + r.err);
  post({ type: 'display', text: r.ok ? String(r.value) : ('error: ' + r.err) });
  post({ type: 'subscribe', object: 'counter', event: 'valueChanged' });
  await call('counter', 'increment', []);
  await call('counter', 'increment', []);
  post({ type: 'provide', object: 'webpage', methods: Object.keys(provided) });
}
poll();
post({ type: 'ready' });
</script>
</body>
</html>
